[project]
name = "school-erp-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends()/Query() in defaults is the intended pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# test-only Razorpay stand-in with an embedded browser script
"tests/e2e_support/*.py" = ["E501"]
# message wording: long sentences read better unbroken
"app/services/notify/catalog.py" = ["E501"]
