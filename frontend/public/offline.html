<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b362b">
<title>You're offline · School ERP</title>
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<style>
  @font-face { font-family: "Figtree"; font-weight: 400; font-display: swap; src: url(/fonts/figtree-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Figtree"; font-weight: 600; font-display: swap; src: url(/fonts/figtree-latin-600-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: #f6f7f5; color: #1a2321; font: 400 16px/1.5 "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; display: block; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; color: #5d6b67; font-size: 15px; }
  .card { margin: 20px 0; padding: 14px 16px; border: 1px solid #dfe4e1; border-radius: 10px; background: #fff; text-align: left; font-size: 14px; color: #1a2321; }
  .card ul { margin: 6px 0 0; padding-left: 18px; color: #5d6b67; }
  button {
    min-height: 44px; padding: 0 22px; border: 0; border-radius: 8px; background: #2f6b57; color: #fff;
    font: 600 15px "Figtree", ui-sans-serif, system-ui, sans-serif; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #f2c230; outline-offset: 2px; }
  .status { margin-top: 14px; font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/icons/icon-192.png" alt="" width="64" height="64">
  <h1>You're offline</h1>
  <p>This page needs the internet, and this phone isn't connected right now.</p>
  <div class="card">
    While you wait:
    <ul>
      <li>Pages you opened recently may still open from the app.</li>
      <li>Nothing is saved while offline — fees, attendance and marks are only ever shown live.</li>
    </ul>
  </div>
  <button id="retry" type="button">Try again</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script>
  (function () {
    var status = document.getElementById("status");
    function retry() { status.textContent = "Checking…"; location.reload(); }
    document.getElementById("retry").addEventListener("click", retry);
    // reconnects on its own as soon as the phone is back online
    window.addEventListener("online", function () { status.textContent = "Back online — reloading…"; setTimeout(retry, 300); });
  })();
</script>
</body>
</html>
